# apphosting.yaml
# Firebase App Hosting runtime configuration.
# See: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # ── Public Firebase Client SDK ──
  # These are public client-side values embedded in the browser bundle.
  # They are NOT secrets — they are safe to commit as plain values.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDxT99fYHhqdvRl11lxJ9WarcKrv0y41Jc

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: bvpw108.firebaseapp.com

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: bvpw108

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: bvpw108.firebasestorage.app

  # Used by the authenticated server upload route. File bytes are stored in
  # Firebase Storage rather than the disposable App Hosting filesystem.
  - variable: FIREBASE_STORAGE_BUCKET
    value: bvpw108.firebasestorage.app
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "10237671112"

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:10237671112:web:3ee6046eaef61f0fbe57fd"

  # ── App URL ──
  - variable: ZITE_APP_URL
    value: https://academy.prabhupadaworld.com

  # ── Server-side secrets ──
  # Values live in Cloud Secret Manager and are available only at runtime.
  # Provision/rotate them with `firebase apphosting:secrets:set` before rollout.
  - variable: ZITE_REMINDER_SECRET
    secret: ziteReminderSecret
    availability:
      - RUNTIME

  - variable: ZITE_CRON_SECRET
    secret: ziteCronSecret
    availability:
      - RUNTIME

  - variable: APP_TAGMANGO_WEBHOOK_SECRET
    secret: tagMangoWebhookSecret
    availability:
      - RUNTIME

  - variable: ZITE_VAPID_PUBLIC_KEY
    value: BAarbQem_U8AvpVQFhZuwDGpEML2AV7iG-Ts4EVRyM3PpJXDS1EevhEE5E85OUv56u9BiTo_27qo8nLW_JOMwtw

  - variable: ZITE_VAPID_PRIVATE_KEY
    secret: ziteVapidPrivateKey
    availability:
      - RUNTIME
